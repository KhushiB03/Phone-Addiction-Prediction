#name github displays in github actions tab

name: Run Tests
#Whenever someone pushes code to the main branch, run the workflow.
on:
  push:
    branches:
      - main
      #If someone creates a pull request targeting main, run the tests too.
  pull_request:
    branches:
      - main

jobs:
  test:
#Give me a temporary Ubuntu/Linux computer to run my tests.
    runs-on: ubuntu-latest

   steps:
# GitHub's machine initially doesn't have your project files.

# This step downloads/checks out your repository into the GitHub Actions machine.
      - name: Checkout repository
        uses: actions/checkout@v4
        #after above it will have all files


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            #This tells GitHub:



#match this to the Python version you actually use locally/for deployment.
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest